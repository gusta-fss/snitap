<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snitap</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500&family=Montserrat:wght@500&family=Syne:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <header>
        <nav class="container flex align-center">
            <a title="logo" href="#"><img src="assets/icons/logo.svg" alt=""></a>
            <a title="shopping" href="#">
                <img src="assets/icons/shopping-bag.svg" alt="">
                <span class="flex align-center justify-center">1</span>
            </a>
        </nav>
    </header>

    <section id="hero" class="container flex align-center">
        <div>
            <h1>
                Snitap, sua vida mais
                <div>
                    <span>radical</span>
                    <span>divertida</span>
                    <span>saudável</span>
                    <span>radical</span>
                </div>
            </h1>
            <div class="buttons">
                <a href="#" class="button buy shadow">
                    <img src="assets/icons/shopping-bag.svg" alt="">
                    COMPRAR AGORA
                </a>
                <a href="#" class="button play">
                    <span class="shadow">
                        <img src="assets/icons/play.svg" alt="">
                    </span>
                    VEJA EM AÇÃO
                </a>
            </div>
        </div>
        <div id="patins">
            <div class="content">
                <img src="assets/hero/ellipse.svg" alt="">

                <img src="assets/hero/stars-1.svg" alt="">
                <img src="assets/hero/stars-2.svg" alt="">
            </div>
        </div>
    </section>

    <section id="banner">
        <div class="scroller bg-gradient-animated">
            <div class="rolling flex">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">

                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">

                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
                <img src="assets/banner.svg" alt="">
            </div>
        </div>
    </section>

    <section id="gallery" class="container">
        <header>
            <span>Galeria de fotos</span>
            <h2>#usesnitap por aí</h2>
        </header>
        <div class="content">
            <figure>
                <img src="assets/images/01.png" alt="">
                <figcaption class="flex align-center">
                    <img src="assets/instagram-pic.png" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure data-delay>
                <img src="assets/images/02.png" alt="">
                <figcaption class="flex align-center">
                    <img src="assets/instagram-pic.png" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure>
                <img src="assets/images/03.png" alt="">

                    <img src="assets/instagram-pic.png" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure data-delay>
                <img src="assets/images/04.png" alt="">
                <figcaption class="flex align-center">
                    <img src="assets/instagram-pic.png" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
